on:
    push:
        branches:
            - master

permissions:
    contents: write
    pull-requests: write
    id-token: write

name: Manage Release
jobs:
    release_please:
        name: Create or prepare release
        runs-on: ubuntu-24.04
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            # Uses release-please-config.json and .release-please-manifest.json
            # from the repository root (manifest mode).
            - uses: googleapis/release-please-action@v4
              id: release

    publish_asset:
        name: Attach deployment bundle
        runs-on: ubuntu-24.04
        needs: release_please
        if: ${{ needs.release_please.outputs.release_created }}
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Resolve the bundle name
              id: meta
              run: echo "name=${PACKAGE_NAME:-$(node -p "require('./package.json').name")}" >> "$GITHUB_OUTPUT"
              env:
                  PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}

            - name: Install production dependencies
              run: npm ci --omit=dev

            - name: Record the released commit
              run: echo "${{ github.sha }}" > Release.txt

            - name: Build the deployment bundle
              run: tar --exclude-vcs --exclude=.github --exclude=test --exclude=coverage -czf "/tmp/${BUNDLE}.tar.gz" .
              env:
                  BUNDLE: ${{ steps.meta.outputs.name }}

            - name: Attach the bundle to the release
              run: gh release upload "$TAG" "/tmp/${BUNDLE}.tar.gz" --clobber
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.release_please.outputs.tag_name }}
                  BUNDLE: ${{ steps.meta.outputs.name }}
